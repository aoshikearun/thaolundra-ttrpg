<!-- Modal de Características (Qualidade/Defeito) -->
<div id="modal-caracteristica" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modal-caracteristica-title">➕ Adicionar Característica</h3>
            <button class="modal-close" onclick="fecharModalCaracteristica()">✕</button>
        </div>
        <div class="modal-body">
            <form id="form-caracteristica" onsubmit="return false;">
                <input type="hidden" id="caracteristica-categoria" value="Qualidade">
                
                <div class="categoria-selector">
                    <button type="button" class="categoria-btn qualidade active" data-categoria="Qualidade" onclick="setCategoriaCaracteristica('Qualidade')">
                        ✨ Qualidade
                    </button>
                    <button type="button" class="categoria-btn defeito" data-categoria="Defeito" onclick="setCategoriaCaracteristica('Defeito')">
                        ⚠️ Defeito
                    </button>
                </div>

                <div class="form-group">
                    <label for="caracteristica-nome">Nome *</label>
                    <input type="text" id="caracteristica-nome" class="form-control" placeholder="Ex: Corajoso, Medroso..." required>
                </div>

                <div class="form-group">
                    <label for="caracteristica-descricao">Descrição</label>
                    <textarea id="caracteristica-descricao" class="form-control" rows="3" placeholder="Descreva como isso afeta o personagem..."></textarea>
                </div>

                <div class="form-group">
                    <label for="caracteristica-score">Pontuação (Score)</label>
                    <div class="score-input-group">
                        <button type="button" class="btn-score" onclick="ajustarScoreCaracteristica(-1)">−</button>
                        <input type="number" id="caracteristica-score" class="form-control score-input" value="1" min="-5" max="5" readonly>
                        <button type="button" class="btn-score" onclick="ajustarScoreCaracteristica(1)">+</button>
                    </div>
                    <span class="form-help">Qualidades: positivo (+1 a +5) | Defeitos: negativo (-1 a -5)</span>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="fecharModalCaracteristica()">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="adicionarCaracteristica()">✅ Adicionar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.categoria-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
}

.categoria-btn {
    flex: 1;
    padding: 10px;
    border: 2px solid var(--border-light);
    border-radius: 8px;
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
    text-align: center;
    font-size: 14px;
}

.categoria-btn:hover {
    border-color: var(--primary);
    color: var(--text-primary);
}

.categoria-btn.active {
    border-color: var(--primary);
    color: var(--primary);
    background: rgba(255, 179, 71, 0.08);
}

.categoria-btn.qualidade.active {
    border-color: var(--success);
    color: var(--success);
    background: rgba(16, 185, 129, 0.08);
}

.categoria-btn.defeito.active {
    border-color: var(--danger);
    color: var(--danger);
    background: rgba(239, 68, 68, 0.08);
}

.score-input-group {
    display: flex;
    align-items: center;
    gap: 12px;
}

.btn-score {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border-light);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-score:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.score-input {
    width: 80px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    background: var(--bg-tertiary) !important;
    border: 1px solid var(--border-light) !important;
    padding: 8px;
}
</style>

<script>
let categoriaCaracteristicaAtual = 'Qualidade';
let callbackCaracteristica = null;

function abrirModalCaracteristica(categoria, callback) {
    categoriaCaracteristicaAtual = categoria || 'Qualidade';
    callbackCaracteristica = callback || null;
    
    const modal = document.getElementById('modal-caracteristica');
    const title = document.getElementById('modal-caracteristica-title');
    const form = document.getElementById('form-caracteristica');
    
    // Resetar formulário
    form.reset();
    document.getElementById('caracteristica-score').value = categoria === 'Qualidade' ? 1 : -1;
    document.getElementById('caracteristica-categoria').value = categoria || 'Qualidade';
    
    // Atualizar título
    title.textContent = categoria === 'Qualidade' ? '➕ Adicionar Qualidade' : '⚠️ Adicionar Defeito';
    
    // Atualizar botões
    document.querySelectorAll('.categoria-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.categoria === (categoria || 'Qualidade')) {
            btn.classList.add('active');
        }
    });
    
    modal.style.display = 'flex';
    modal.classList.add('active');
}

function fecharModalCaracteristica() {
    const modal = document.getElementById('modal-caracteristica');
    modal.style.display = 'none';
    modal.classList.remove('active');
}

function setCategoriaCaracteristica(categoria) {
    categoriaCaracteristicaAtual = categoria;
    document.getElementById('caracteristica-categoria').value = categoria;
    document.getElementById('caracteristica-score').value = categoria === 'Qualidade' ? 1 : -1;
    
    document.querySelectorAll('.categoria-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.categoria === categoria) {
            btn.classList.add('active');
        }
    });
    
    const title = document.getElementById('modal-caracteristica-title');
    title.textContent = categoria === 'Qualidade' ? '➕ Adicionar Qualidade' : '⚠️ Adicionar Defeito';
    
    atualizarPreviewEXPCaracteristica();
}

function ajustarScoreCaracteristica(delta) {
    const input = document.getElementById('caracteristica-score');
    let value = parseInt(input.value) || 0;
    const categoria = document.getElementById('caracteristica-categoria').value;
    const max = categoria === 'Qualidade' ? 5 : -1;
    const min = categoria === 'Qualidade' ? 1 : -5;
    
    value = Math.max(min, Math.min(max, value + delta));
    input.value = value;
    atualizarPreviewEXPCaracteristica();
}

function atualizarPreviewEXPCaracteristica() {
    const value = parseInt(document.getElementById('caracteristica-score').value) || 0;
    const expImpact = -value * 100;
    // Atualizar preview se existir
    const preview = document.querySelector('.score-preview-exp');
    if (preview) {
        preview.textContent = expImpact >= 0 ? `+${expImpact} EXP` : `${expImpact} EXP`;
        preview.style.color = expImpact >= 0 ? 'var(--success)' : 'var(--danger)';
    }
}

function adicionarCaracteristica() {
    const nome = document.getElementById('caracteristica-nome').value.trim();
    const descricao = document.getElementById('caracteristica-descricao').value.trim();
    const score = parseInt(document.getElementById('caracteristica-score').value) || 0;
    const categoria = document.getElementById('caracteristica-categoria').value;
    
    if (!nome) {
        alert('Digite um nome para a característica.');
        return;
    }
    
    const caracteristica = {
        nome,
        descricao,
        score,
        categoria
    };
    
    if (callbackCaracteristica) {
        callbackCaracteristica(caracteristica);
    }
    
    fecharModalCaracteristica();
}

// Fechar com ESC
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        fecharModalCaracteristica();
    }
});

// Fechar ao clicar no overlay
document.addEventListener('click', function(e) {
    const modal = document.getElementById('modal-caracteristica');
    if (e.target === modal) {
        fecharModalCaracteristica();
    }
});
</script>
