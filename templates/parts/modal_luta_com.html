<!-- Modal para escolher/criar arma para Luta com _____ -->
<div id="modal-luta-com" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>⚔️ Escolha a Arma</h3>
            <button class="modal-close" onclick="fecharModalLutaCom()">✕</button>
        </div>
        <div class="modal-body">
            <p class="modal-description">
                Selecione a arma para a perícia <strong>"Luta com _____"</strong>
            </p>
            
            <form id="form-luta" onsubmit="return false;">
                <div class="form-group">
                    <label for="arma-select">Arma Existente</label>
                    <select id="arma-select" class="form-control">
                        <option value="">-- Selecione --</option>
                    </select>
                </div>

                <div class="form-divider">ou</div>

                <div class="form-group">
                    <label for="nova-arma">Criar Nova Arma</label>
                    <div class="input-group">
                        <input type="text" id="nova-arma" class="form-control" placeholder="Ex: Machado Duplo...">
                        <button type="button" class="btn btn-success btn-sm" onclick="criarNovaArmaLuta()">Criar</button>
                    </div>
                </div>

                <div class="arma-selecionada-feedback" id="arma-feedback" style="display: none;">
                    ✅ Arma selecionada: <strong id="arma-selecionada-nome"></strong>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="fecharModalLutaCom()">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="confirmarArmaLuta()">✅ Confirmar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.modal-description {
    color: var(--text-secondary);
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.5;
}

.modal-description strong {
    color: var(--primary);
}

.form-divider {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 16px 0;
    position: relative;
}

.form-divider::before,
.form-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 35%;
    height: 1px;
    background: var(--border-light);
}

.form-divider::before { left: 0; }
.form-divider::after { right: 0; }

.input-group {
    display: flex;
    gap: 8px;
}

.input-group .form-control {
    flex: 1;
}

.btn-sm {
    padding: 6px 14px;
    font-size: 12px;
}

.arma-selecionada-feedback {
    margin-top: 16px;
    padding: 12px 16px;
    background: rgba(16, 185, 129, 0.08);
    border: 1px solid rgba(16, 185, 129, 0.2);
    border-radius: 8px;
    color: var(--success);
    text-align: center;
    font-size: 14px;
}

.btn-success {
    background: var(--success);
    color: white;
}

.btn-success:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(16, 185, 129, 0.3);
}
</style>

<script>
let armaSelecionadaLuta = null;
let callbackArmaLuta = null;

function abrirModalLutaCom(callback) {
    callbackArmaLuta = callback || null;
    armaSelecionadaLuta = null;
    
    const modal = document.getElementById('modal-luta-com');
    const feedback = document.getElementById('arma-feedback');
    const select = document.getElementById('arma-select');
    
    feedback.style.display = 'none';
    select.value = '';
    document.getElementById('nova-arma').value = '';
    
    // Carregar armas existentes
    carregarArmasLuta();
    
    modal.style.display = 'flex';
    modal.classList.add('active');
}

function fecharModalLutaCom() {
    const modal = document.getElementById('modal-luta-com');
    modal.style.display = 'none';
    modal.classList.remove('active');
}

function carregarArmasLuta() {
    const select = document.getElementById('arma-select');
    select.innerHTML = '<option value="">-- Selecione --</option>';
    
    fetch('/api/armas-luta')
        .then(response => response.json())
        .then(data => {
            if (data.success && data.armas) {
                data.armas.forEach(arma => {
                    select.innerHTML += `<option value="${arma.id}">${arma.nome}</option>`;
                });
            }
        })
        .catch(error => console.error('Erro ao carregar armas:', error));
}

function criarNovaArmaLuta() {
    const input = document.getElementById('nova-arma');
    const nome = input.value.trim();
    
    if (!nome) {
        alert('Digite o nome da arma.');
        return;
    }
    
    fetch('/api/armas-luta', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Recarregar lista e selecionar a nova
            carregarArmasLuta();
            const select = document.getElementById('arma-select');
            select.value = data.arma_id;
            
            armaSelecionadaLuta = { id: data.arma_id, nome: nome };
            document.getElementById('arma-selecionada-nome').textContent = nome;
            document.getElementById('arma-feedback').style.display = 'block';
            
            input.value = '';
            alert(`✅ Arma "${nome}" criada e selecionada!`);
        } else {
            alert(`❌ Erro: ${data.message}`);
        }
    })
    .catch(error => {
        console.error('Erro:', error);
        alert('❌ Erro ao criar arma');
    });
}

function confirmarArmaLuta() {
    const select = document.getElementById('arma-select');
    const armaId = select.value;
    
    if (!armaId && !armaSelecionadaLuta) {
        alert('Selecione uma arma ou crie uma nova.');
        return;
    }
    
    let arma;
    if (armaId) {
        const armaNome = select.options[select.selectedIndex].text;
        arma = { id: parseInt(armaId), nome: armaNome };
    } else {
        arma = armaSelecionadaLuta;
    }
    
    if (callbackArmaLuta) {
        callbackArmaLuta(arma);
    }
    
    fecharModalLutaCom();
}

// Seleção manual no select atualiza o feedback
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('arma-select').addEventListener('change', function() {
        const value = this.value;
        if (value) {
            const nome = this.options[this.selectedIndex].text;
            armaSelecionadaLuta = { id: parseInt(value), nome: nome };
            document.getElementById('arma-selecionada-nome').textContent = nome;
            document.getElementById('arma-feedback').style.display = 'block';
        } else {
            armaSelecionadaLuta = null;
            document.getElementById('arma-feedback').style.display = 'none';
        }
    });
});
</script>
